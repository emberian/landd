[workspace]
resolver = "2"
members = [
    "crates/landd-core",
    "crates/ast-sweep",
    "crates/landd-train",
    "crates/landd-sim",
    "crates/landd",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.80"

[workspace.dependencies]
landd-core = { path = "crates/landd-core" }
ast-sweep = { path = "crates/ast-sweep" }
landd-train = { path = "crates/landd-train" }
landd-sim = { path = "crates/landd-sim" }

base64 = "0.22"
bincode = "1.3"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive"] }
ed25519-dalek = "2.2"
hmac = "0.12"
libc = "0.2"
rayon = "1.11"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tikv-jemallocator = "0.6"
toml = "0.8"
tree-sitter = "0.26"
tree-sitter-python = "0.23"

[profile.release]
opt-level = 3
debug = 1

# Tests shell out to git and time the sweep; unoptimized parsing would dominate.
[profile.dev]
opt-level = 2

[profile.test]
opt-level = 2
