[package]
name = "landd"
description = "landd CLI and Unix-socket daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "landd"
path = "src/main.rs"

[dependencies]
landd-core.workspace = true
ast-sweep.workspace = true
landd-train.workspace = true
landd-sim.workspace = true
clap.workspace = true
libc.workspace = true
sha2.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["preserve_order"] }
thiserror.workspace = true
tikv-jemallocator.workspace = true

[dev-dependencies]
landd-core = { workspace = true, features = ["testkit"] }
tempfile.workspace = true
